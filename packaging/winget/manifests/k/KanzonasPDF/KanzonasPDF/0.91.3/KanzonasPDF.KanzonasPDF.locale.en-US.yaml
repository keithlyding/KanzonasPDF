ShortDescription: Free PDF markup, measuring and editing for construction and engineering
Description: |-
  A free, open-source PDF reader and editor for Windows: markups and comments, calibrated
  measuring (length, area, angle, radius, perimeter, volume, count), stamps, forms, signatures,
  editing page text and objects, page tools (rotate, move, crop, combine, create from images),
  compare revisions, redaction, OCR and export. No account, no telemetry; a portable build is
  available too.
