ShortDescription: Free, open-source PDF viewer and editor
Description: |-
  A free, open-source PDF viewer and editor: comments and markups, stamps, editing the PDF's
  own text, pictures and shapes, filling in and signing forms, digital signatures, OCR,
  redaction, passwords, page tools (rotate, reorder, crop, combine, create from images),
  compare revisions, export to Word, Excel and PowerPoint, and printing. Calibrated measuring
  for drawings too. No account, no telemetry; a portable build is available too.
