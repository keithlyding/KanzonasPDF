name: Probe heading scan speed on the Mac (throwaway branch)

on:
  push:
    branches: ["claude/mac-speed-probe"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Machine
        run: |
          python -c "import platform, os; print(platform.platform(), platform.machine(), os.cpu_count(), 'CPUs')"
      - name: PyMuPDF 2.0
        run: |
          python -m pip install -q --only-binary :all: "pymupdf==2.0"
          python tools/probe_heading_speed.py && python tools/probe_text_ways.py
      - name: PyMuPDF 2.1
        run: |
          python -m pip install -q --only-binary :all: "pymupdf==2.1"
          python tools/probe_text_ways.py
