name: Build Windows and Linux apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push to the same branch cancels the older, still-running build (only the newest
# matters, and it publishes everything up to it); tag builds are never cancelled
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

# PyInstaller options of both builds (the Windows exe and the Linux AppImage's app folder;
# --windowed and --icon only matter on Windows)
env:
  PYINSTALLER_OPTIONS: >-
    --noconfirm --windowed --collect-all rapidocr_onnxruntime --collect-all docx
    --collect-all pptx --collect-all pdf2docx --collect-all ezdxf --collect-all openpyxl
    --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all qtawesome
    --collect-all aiohttp --collect-all spellchecker --collect-data kanzonas
    --icon assets/kanzonas.ico --exclude-module tkinter --exclude-module pymupdf.layout
    --name KanzonasPDF

jobs:
  # Windows: the exe folder, setup, portable zip and PortableApps.com layout
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip                       # reuse downloaded packages between builds

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Regression tests (security, document preservation, efficiency budgets)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build exe
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} run.py

      - name: Smoke test (exe starts and opens a PDF)
        shell: pwsh
        run: |
          python -c "import pymupdf; d=pymupdf.open(); d.new_page().insert_text((72,72),'hi'); d.save('test.pdf')"
          $p = Start-Process dist\KanzonasPDF\KanzonasPDF.exe -ArgumentList test.pdf -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Self test (OCR, exports, signatures, forms inside the exe)
        shell: pwsh
        run: |
          # test certificates in the Windows store (RSA and ECDSA) for "Windows certificate store signing"
          New-SelfSignedCertificate -Subject "CN=KanzonasPDF Self Test" -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature,NonRepudiation -KeyAlgorithm RSA -KeyLength 2048 | Out-Null
          New-SelfSignedCertificate -Subject "CN=KanzonasPDF Self Test" -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature,NonRepudiation -KeyAlgorithm ECDSA_nistP256 | Out-Null
          $p = Start-Process dist\KanzonasPDF\KanzonasPDF.exe -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self test failed with code $($p.ExitCode)" }

      - name: License and source notice
        shell: pwsh
        run: |
          # KanzonasPDF uses PyMuPDF/MuPDF (GNU AGPL 3.0): ship the license and say where the source is.
          try { Invoke-WebRequest https://www.gnu.org/licenses/agpl-3.0.txt -OutFile dist\KanzonasPDF\LICENSE-AGPL-3.0.txt }
          catch { Write-Warning "Couldn't download the AGPL text: $_" }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist\KanzonasPDF\LICENSE.txt }
          @"
          KanzonasPDF is free software: you can redistribute it and/or modify it under the terms of
          the GNU Affero General Public License version 3 (see LICENSE-AGPL-3.0.txt).
          It is built on PyMuPDF / MuPDF (Artifex, AGPL 3.0), Qt for Python (LGPL 3.0) and other
          open-source libraries. Complete source code: https://github.com/keithlyding/KanzonasPDF
          "@ | Set-Content dist\KanzonasPDF\NOTICE.txt

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kanzonas; print(kanzonas.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KanzonasPDF -DestinationPath KanzonasPDF-windows.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup isn't available" }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\KanzonasPDF.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Test updating (install an older version, then the new one over it, no uninstall)
        timeout-minutes: 20
        shell: pwsh
        run: |
          # same files labeled 0.0, standing in for "the version the user already has"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=0.0 installer\KanzonasPDF.iss
          if ($LASTEXITCODE -ne 0) { throw "Old installer build failed" }
          $dir = "$env:RUNNER_TEMP\kzupgrade"
          $sargs = "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART"
          $p = Start-Process "dist-installer\KanzonasPDF-v0.0-setup.exe" -ArgumentList ($sargs + "/DIR=$dir") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Old version failed to install" }
          New-Item -Force "HKCU:\Software\KanzonasPDF\upgradetest" | Set-ItemProperty -Name keep -Value "yes"
          # the old version runs with a document open, set to reopen documents at start-up; the
          # setup closes it through Windows (no window is closed) and it must still remember them
          $kz = "HKCU:\Software\KanzonasPDF\KanzonasPDF"
          if (-not (Test-Path $kz)) { New-Item -Force $kz | Out-Null }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\kzbackups" -Force | Out-Null
          Set-ItemProperty $kz -Name restore_session -Value "true"
          Set-ItemProperty $kz -Name update_check -Value "false"
          Set-ItemProperty $kz -Name session_files -Value "[]"
          Set-ItemProperty $kz -Name backup_dir -Value "$env:RUNNER_TEMP\kzbackups"
          $doc = "$env:RUNNER_TEMP\kz-open-during-update.pdf"
          python -c "import pymupdf, sys; d = pymupdf.open(); d.new_page().insert_text((72, 72), 'open'); d.save(sys.argv[1])" $doc
          $old = Start-Process "$dir\KanzonasPDF.exe" -ArgumentList "`"$doc`"" -PassThru
          foreach ($i in 1..60) {
            $old.Refresh()
            if ($old.MainWindowTitle -like "kz-open-during-update*") { break }
            Start-Sleep -Seconds 1
          }
          if ($old.MainWindowTitle -notlike "kz-open-during-update*") { throw "The old version didn't open the document (title '$($old.MainWindowTitle)')" }
          Start-Sleep -Seconds 3
          # the new setup runs exactly as the app's Update now runs it (updates.installer_command):
          # no /DIR (it must find the existing install by itself), and /RELAUNCH starts the app again
          $uargs = "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/CLOSEAPPLICATIONS","/CURRENTUSER","/RELAUNCH"
          # (not -Wait: that also waits for the programs the setup starts, and it starts KanzonasPDF)
          $p = Start-Process "dist-installer\KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe" -ArgumentList $uargs -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "Update over the old version failed" }
          if (-not $old.HasExited) { $old | Stop-Process -Force; throw "The setup didn't close the running KanzonasPDF" }
          $files = (Get-ItemProperty $kz).session_files
          if ($files -notlike "*kz-open-during-update.pdf*") { throw "The document open during the update wasn't remembered: '$files'" }
          # started again, it reopens the document
          $again = $null
          foreach ($i in 1..60) {
            $again = Get-Process KanzonasPDF -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($dir) }
            if ($again -and ($again | Where-Object { $_.MainWindowTitle -like "kz-open-during-update*" })) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $again) { throw "The update didn't start KanzonasPDF again" }
          $title = ($again | Select-Object -First 1).MainWindowTitle
          $again | Stop-Process -Force
          if ($title -notlike "kz-open-during-update*") { throw "Started again, KanzonasPDF didn't reopen the document (title '$title')" }
          Start-Sleep -Seconds 2
          Set-ItemProperty $kz -Name restore_session -Value "false"
          Remove-ItemProperty $kz -Name update_check, session_files, backup_dir -ErrorAction SilentlyContinue
          $un = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F4C2A61-5B7E-4D3A-9C1F-2E6B7A9D4C11}_is1"
          $ver = (Get-ItemProperty $un).DisplayVersion
          if ($ver -ne "${{ steps.ver.outputs.version }}") { throw "Installed version is '$ver' after the update" }
          if ((Get-ItemProperty $un).InstallLocation.TrimEnd('\') -ne $dir) { throw "Update installed to a different folder" }
          if ((Get-ItemProperty "HKCU:\Software\KanzonasPDF\upgradetest").keep -ne "yes") { throw "Update lost the user's settings" }
          $p = Start-Process "$dir\KanzonasPDF.exe" -ArgumentList "--selftest","upgraded-selftest.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content upgraded-selftest.log; throw "Updated app failed its self test" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 5
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasPDF\upgradetest" -ErrorAction SilentlyContinue
          Remove-Item "dist-installer\KanzonasPDF-v0.0-setup.exe"
          Write-Host "Updated 0.0 -> ${{ steps.ver.outputs.version }} in place; settings kept"

      - name: Test the installer (install, self test the installed app, uninstall)
        shell: pwsh
        run: |
          $setup = "dist-installer\KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe"
          $dir = "$env:RUNNER_TEMP\kzinstall"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/DIR=$dir","/TASKS=pdfdefault" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed with code $($p.ExitCode)" }
          $p = Start-Process "$dir\KanzonasPDF.exe" -ArgumentList "--selftest","installed-selftest.log" -PassThru -Wait
          Get-Content installed-selftest.log
          if ($p.ExitCode -ne 0) { throw "Installed app failed its self test" }
          if (-not (Test-Path "HKCU:\Software\Classes\KanzonasPDF.Document\shell\open\command")) { throw "PDF association missing" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\KanzonasPDF.exe") { throw "Uninstall left the app behind" }

      - name: Portable version (settings and files stay in a data folder beside the exe)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item -Recurse dist\KanzonasPDF portable\KanzonasPDF
          @"
          KanzonasPDF portable

          Because this file is here, KanzonasPDF keeps its settings, your signatures, stamp images
          and certificate in the "data" folder next to KanzonasPDF.exe instead of the computer's
          registry and user folders. Copy the whole KanzonasPDF folder anywhere (a USB
          stick, a network drive) and run KanzonasPDF.exe. No installation or Python needed.
          Delete this file to make it behave like the installed version.
          "@ | Set-Content portable\KanzonasPDF\portable.txt
          Compress-Archive -Path portable\KanzonasPDF -DestinationPath KanzonasPDF-portable.zip
          # test a copy: it must run, keep its settings in data\ and leave the registry alone
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasPDF" -ErrorAction SilentlyContinue
          Copy-Item -Recurse portable\KanzonasPDF "$env:RUNNER_TEMP\kzportable"
          $p = Start-Process "$env:RUNNER_TEMP\kzportable\KanzonasPDF.exe" -ArgumentList "--selftest","portable-selftest.log" -PassThru -Wait
          Get-Content portable-selftest.log
          if ($p.ExitCode -ne 0) { throw "Portable app failed its self test" }
          if (-not (Test-Path "$env:RUNNER_TEMP\kzportable\data\settings.ini")) { throw "Portable settings not in data folder" }
          if (Test-Path "HKCU:\Software\KanzonasPDF") { throw "Portable app wrote to the registry" }

      - name: PortableApps.com package layout (finished by hand with their tools)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/make_portableapps.py "${{ steps.ver.outputs.version }}" dist\KanzonasPDF KanzonasPDFPortable
          if ($LASTEXITCODE -ne 0) { throw "Making the PortableApps.com layout failed" }
          # the program in the package keeps its data in the package's Data folder, leaves the
          # registry alone and doesn't offer to update itself
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasPDF" -ErrorAction SilentlyContinue
          $p = Start-Process "KanzonasPDFPortable\App\KanzonasPDF\KanzonasPDF.exe" -ArgumentList "--selftest","paf-selftest.log" -PassThru -Wait
          Get-Content paf-selftest.log
          if ($p.ExitCode -ne 0) { throw "PortableApps.com package failed its self test" }
          if (-not (Test-Path "KanzonasPDFPortable\Data\settings.ini")) { throw "Settings not in the package's Data folder" }
          if (Test-Path "HKCU:\Software\KanzonasPDF") { throw "PortableApps.com package wrote to the registry" }
          Remove-Item -Recurse -Force "KanzonasPDFPortable\Data"
          # uploaded as a folder (GitHub zips each artifact once); the paf folder keeps
          # KanzonasPDFPortable as the top folder in the download
          New-Item -ItemType Directory paf | Out-Null
          Move-Item KanzonasPDFPortable paf\KanzonasPDFPortable

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-portableapps-layout
          path: paf/

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-portable
          path: portable/

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-windows
          path: dist/

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-setup
          path: dist-installer/KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe

      - name: winget manifests for this version (attached to the release; see packaging/winget)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $sha = (Get-FileHash -Algorithm SHA256 "dist-installer\KanzonasPDF-v$v-setup.exe").Hash
          $src = "packaging\winget\manifests\k\KanzonasPDF\KanzonasPDF"
          $from = Get-ChildItem $src -Directory | Sort-Object { [version]($_.Name + ".0") } | Select-Object -Last 1
          $dir = "winget\manifests\k\KanzonasPDF\KanzonasPDF\$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($f in Get-ChildItem $from.FullName -Filter *.yaml) {
            $t = Get-Content $f.FullName -Raw
            $t = $t -replace [regex]::Escape($from.Name), $v
            $t = $t -replace 'InstallerSha256: [0-9A-Fa-f]+', "InstallerSha256: $sha"
            $t = $t -replace 'ReleaseDate: \d{4}-\d{2}-\d{2}', ("ReleaseDate: " + (Get-Date -Format yyyy-MM-dd))
            Set-Content -Encoding utf8 (Join-Path $dir $f.Name) $t
          }
          Get-ChildItem $dir | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
          Compress-Archive -Path winget\manifests -DestinationPath winget-manifests.zip

      - name: Release notes (RELEASE_NOTES.md; the update box shows them)
        id: notes
        shell: pwsh
        run: |
          python tools/release_notes.py "${{ steps.ver.outputs.version }}" --github-output
          if ($LASTEXITCODE -ne 0) { throw "Write the notes for this version in RELEASE_NOTES.md" }

      # the Windows files of the release, for the publish job (only builds that can publish)
      - name: Windows release files for publishing
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          retention-days: 5
          compression-level: 0
          if-no-files-found: error
          path: |
            dist-installer/KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe
            KanzonasPDF-portable.zip
            KanzonasPDF-windows.zip
            winget-manifests.zip

  # ---------------------------------------------------------------------------------------
  # Linux: an AppImage (x86_64). Built on the oldest Ubuntu it supports, so it runs on
  # glibc 2.35 and newer (Ubuntu 22.04, Debian 12, Fedora 36 and later); PySide6 6.12's
  # wheels need glibc 2.34. packaging/linux/make_appimage.py makes the AppDir and checks it.
  linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      # appimagetool pinned to an exact release file and checked against its SHA-256. The
      # AppImage runtime (the small program at the start of every AppImage) is the one at the
      # start of appimagetool itself (an AppImage too): its first APPIMAGE_RUNTIME_BYTES
      # bytes, checked against their own SHA-256, so it is pinned with appimagetool instead
      # of appimagetool fetching the unpinned "continuous" runtime
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
      APPIMAGE_RUNTIME_BYTES: "692512"
      APPIMAGE_RUNTIME_SHA256: 33a0fb9c4e2477d0cf1994a179e983633f3b3e77876b190bacff32f335551091
      # the oldest system supported (Ubuntu 22.04's glibc and GCC 12's libstdc++): the build
      # fails if a bundled file needs newer ones
      MAX_GLIBC: "2.35"
      MAX_GLIBCXX: "3.4.30"
      # an AppImage much bigger than this means something unexpected got bundled
      MAX_APPIMAGE_MB: "400"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (bundled into the AppImage) and test tools
        run: |
          # Qt's X11 platform needs the xcb libraries (not on every desktop: they go into the
          # AppImage); Xvfb and xdotool run the tests; appstream and desktop-file-utils check
          # the metadata
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libgtk-3-0 libcups2 \
            xvfb xauth xdotool appstream desktop-file-utils

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints.txt pyinstaller
          # OpenCV (used by OCR) without its GUI: the GUI build carries Qt 5, FFmpeg and their X11
          # libraries (about 120 MB) and sets Qt 5 plugin paths in the environment when imported.
          # Same version as the pinned opencv-python.
          v=$(sed -n 's/^opencv-python==\([0-9.]*\).*/\1/p' constraints.txt)
          test -n "$v"
          python -m pip uninstall -y opencv-python opencv-python-headless
          python -m pip install --no-deps "opencv-python-headless==$v"
          python -c "import cv2; print('OpenCV', cv2.__version__)"

      - name: Regression tests (security, document preservation, efficiency budgets)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the app folder (PyInstaller, the same options as Windows)
        run: python -m PyInstaller ${{ env.PYINSTALLER_OPTIONS }} --runtime-hook packaging/linux/pyi_rth_linux_env.py run.py

      - name: License and source notice
        run: |
          # KanzonasPDF uses PyMuPDF/MuPDF (GNU AGPL 3.0): ship the license and say where the source is
          # (the same files as the Windows build)
          curl -fsSL --retry 3 https://www.gnu.org/licenses/agpl-3.0.txt -o dist/KanzonasPDF/LICENSE-AGPL-3.0.txt \
            || echo "::warning::Couldn't download the AGPL text"
          cp LICENSE dist/KanzonasPDF/LICENSE.txt
          cat > dist/KanzonasPDF/NOTICE.txt <<'EOF'
          KanzonasPDF is free software: you can redistribute it and/or modify it under the terms of
          the GNU Affero General Public License version 3 (see LICENSE-AGPL-3.0.txt).
          It is built on PyMuPDF / MuPDF (Artifex, AGPL 3.0), Qt for Python (LGPL 3.0) and other
          open-source libraries. Complete source code: https://github.com/keithlyding/KanzonasPDF
          EOF

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import kanzonas; print(kanzonas.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Fetch appimagetool and the AppImage runtime (pinned, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          fetch() {   # url, expected sha256, file
            if ! [[ "$2" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No SHA-256 pinned for $1 (set it in the linux job's env)"
              curl -fsSL --retry 3 -o "$3" "$1" && echo "That file's SHA-256 is $(sha256sum "$3" | cut -d' ' -f1): check it on the release page before pinning it."
              exit 1
            fi
            curl -fsSL --retry 3 -o "$3" "$1"
            got=$(sha256sum "$3" | cut -d' ' -f1)
            if [ "$got" != "$2" ]; then
              echo "::error::$1 has SHA-256 $got, not the pinned $2"
              exit 1
            fi
          }
          fetch "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256" "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage"
          # the runtime: the start of appimagetool (a type 2 AppImage: "AI\x02" at byte 8)
          head -c "$APPIMAGE_RUNTIME_BYTES" "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" > "$RUNNER_TEMP/tools/runtime-x86_64"
          got=$(sha256sum "$RUNNER_TEMP/tools/runtime-x86_64" | cut -d' ' -f1)
          if [ "$got" != "$APPIMAGE_RUNTIME_SHA256" ]; then
            echo "::error::the runtime cut from appimagetool has SHA-256 $got, not the pinned $APPIMAGE_RUNTIME_SHA256"
            exit 1
          fi
          python - "$RUNNER_TEMP/tools/runtime-x86_64" <<'PY'
          import sys
          d = open(sys.argv[1], "rb").read(16)
          assert d[:4] == b"\x7fELF" and d[8:11] == b"AI\x02", "not a type 2 AppImage runtime"
          PY

      - name: Make the AppImage (AppDir, excluded libraries, compatibility checks)
        run: |
          python packaging/linux/make_appimage.py dist/KanzonasPDF AppDir \
            --version "${{ steps.ver.outputs.version }}" \
            --max-glibc "$MAX_GLIBC" --max-glibcxx "$MAX_GLIBCXX" \
            --appimagetool "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" \
            --runtime-file "$RUNNER_TEMP/tools/runtime-x86_64" \
            --output KanzonasPDF-x86_64.AppImage

      - name: Check the AppImage (size, contents)
        run: |
          size=$(stat -c %s KanzonasPDF-x86_64.AppImage)
          echo "KanzonasPDF-x86_64.AppImage: $((size / 1000000)) MB"
          if [ "$size" -gt $((MAX_APPIMAGE_MB * 1000000)) ]; then
            echo "::error::The AppImage is bigger than $MAX_APPIMAGE_MB MB"; exit 1
          fi
          # what's really inside (not just the AppDir it was made from)
          rm -rf squashfs-root
          ./KanzonasPDF-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/kanzonaspdf.desktop
          test -f squashfs-root/usr/lib/KanzonasPDF/LICENSE.txt
          test -f squashfs-root/usr/lib/KanzonasPDF/NOTICE.txt
          bad=$(grep -v '^\s*\(#\|$\)' packaging/linux/excludelist | while read -r lib; do
                  find squashfs-root -name "$lib" -type f; done)
          if [ -n "$bad" ]; then echo "::error::Libraries the computer provides are bundled: $bad"; exit 1; fi
          rm -rf squashfs-root

      - name: Self test (the AppImage; OCR, exports, signatures, forms)
        run: |
          # no FUSE on the build machines: the AppImage unpacks itself and runs
          code=0
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./KanzonasPDF-x86_64.AppImage --appimage-extract-and-run --selftest selftest-linux.log || code=$?
          cat selftest-linux.log
          if [ $code -ne 0 ]; then echo "::error::Self test failed with code $code"; exit 1; fi
          if grep -q '^FAIL' selftest-linux.log; then echo "::error::Self test has failures"; exit 1; fi
          grep -q '^PASS performance budget' selftest-linux.log

      - name: Smoke test (the AppImage starts and opens a PDF)
        run: packaging/linux/smoke_test.sh ./KanzonasPDF-x86_64.AppImage --appimage-extract-and-run

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-linux
          path: KanzonasPDF-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: linux-selftest-log
          path: selftest-linux.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # Publishing, once both builds and their tests have passed (a failed Windows or Linux build
  # publishes nothing). A push to main with a version that has no release yet publishes a
  # draft unless the repository variable AUTO_RELEASE is 'true' (then it is a real
  # release). Tag builds (refs/tags/v*) of a commit on main are always real releases. AUTO_RELEASE=false
  # skips publishing (create a release or tag v<version> by hand; that builds and
  # publishes). Builds of other branches don't run this job.
  publish:
    needs: [build, linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Same version on Windows and Linux
        run: |
          echo "Windows ${{ needs.build.outputs.version }}, Linux ${{ needs.linux.outputs.version }}"
          test -n "$VERSION"
          test "$VERSION" = "${{ needs.linux.outputs.version }}"

      - name: Is this version already released?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then new=false; else new=true; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION: new release = $new"

      # a v* tag publishes only when the tagged commit is already on main (reviewed through a
      # pull request); a tag pushed on any other commit builds but doesn't publish
      - name: Is the tagged commit on main?
        id: onmain
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "${{ github.sha }}" FETCH_HEAD; then on=true; else on=false; fi
          echo "main=$on" >> "$GITHUB_OUTPUT"
          echo "Tagged commit on main: $on"

      - uses: actions/download-artifact@v6
        with:
          name: release-windows
          path: release

      - uses: actions/download-artifact@v6
        with:
          name: KanzonasPDF-v${{ needs.linux.outputs.version }}-linux
          path: release

      - name: Checksums (SHA-256) of the downloads
        id: sums
        working-directory: release
        run: |
          mv "dist-installer/KanzonasPDF-v$VERSION-setup.exe" .
          chmod +x KanzonasPDF-x86_64.AppImage
          sha256sum "KanzonasPDF-v$VERSION-setup.exe" KanzonasPDF-portable.zip KanzonasPDF-windows.zip \
            KanzonasPDF-x86_64.AppImage > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          { echo "text<<KZSUMS"; cat ../SHA256SUMS.txt; echo "KZSUMS"; } >> "$GITHUB_OUTPUT"

      - name: Release notes (RELEASE_NOTES.md; the update box shows them)
        id: notes
        run: python3 tools/release_notes.py "$VERSION" --github-output

      - name: Publish release
        if: >-
          (startsWith(github.ref, 'refs/tags/v') && steps.onmain.outputs.main == 'true') ||
          (github.ref == 'refs/heads/main' && steps.rel.outputs.new == 'true' &&
           vars.AUTO_RELEASE != 'false')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: ${{ vars.AUTO_RELEASE != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
          name: KanzonasPDF ${{ env.VERSION }}
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          body: |
            **Download `KanzonasPDF-v${{ env.VERSION }}-setup.exe`** and run it (no administrator rights needed).
            **Portable (no install; settings stay with the app):** download `KanzonasPDF-portable.zip`, unzip it
            anywhere (e.g. a USB stick) and run `KanzonasPDF.exe`; settings stay in its `data` folder.
            To update, unzip the new one over the same folder (replace the files): the path to `KanzonasPDF.exe`
            stays the same, so it stays your default PDF app, and the `data` folder is kept.
            **Linux (64-bit PC; Ubuntu 22.04, Debian 12, Fedora 36 or newer):** download `KanzonasPDF-x86_64.AppImage`,
            make it executable (`chmod +x KanzonasPDF-x86_64.AppImage`, or Properties > Allow executing) and run it.
            To update, replace the file with the new one.

            ${{ steps.notes.outputs.notes }}

            All the details: [CHANGELOG.md](https://github.com/keithlyding/KanzonasPDF/blob/v${{ env.VERSION }}/CHANGELOG.md).
            Free software under the GNU AGPL 3.0. [Code signing policy](https://github.com/keithlyding/KanzonasPDF/blob/main/CODE_SIGNING_POLICY.md).

            **Check your download (SHA-256):** in PowerShell, `Get-FileHash <file>` (on Linux, `sha256sum <file>`) must show the same value.
            ```
            ${{ steps.sums.outputs.text }}
            ```
          files: |
            SHA256SUMS.txt
            release/KanzonasPDF-v${{ env.VERSION }}-setup.exe
            release/KanzonasPDF-portable.zip
            release/KanzonasPDF-windows.zip
            release/KanzonasPDF-x86_64.AppImage
            release/winget-manifests.zip
