name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push to the same branch cancels the older, still-running build (only the newest
# matters, and it publishes everything up to it); tag builds are never cancelled
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                       # reuse downloaded packages between builds

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          # OCR only needs OpenCV's image functions: the headless build is the same cv2 module
          # without the GUI parts (smaller download). The self test's OCR check verifies it.
          python -m pip uninstall -y opencv-python
          python -m pip install opencv-python-headless

      - name: Build exe
        run: python -m PyInstaller --noconfirm --windowed --collect-all rapidocr_onnxruntime --collect-all docx --collect-all pptx --collect-all pdf2docx --collect-all ezdxf --collect-all openpyxl --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all qtawesome --collect-all aiohttp --icon assets/kanzonas.ico --exclude-module tkinter --name KanzonasPDF run.py

      - name: Smoke test (exe starts and opens a PDF)
        shell: pwsh
        run: |
          python -c "import pymupdf; d=pymupdf.open(); d.new_page().insert_text((72,72),'hi'); d.save('test.pdf')"
          $p = Start-Process dist\KanzonasPDF\KanzonasPDF.exe -ArgumentList test.pdf -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Self test (OCR, exports, signatures, forms inside the exe)
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasPDF\KanzonasPDF.exe -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self test failed with code $($p.ExitCode)" }

      - name: License and source notice
        shell: pwsh
        run: |
          # KanzonasPDF uses PyMuPDF/MuPDF (GNU AGPL 3.0): ship the license and say where the source is.
          try { Invoke-WebRequest https://www.gnu.org/licenses/agpl-3.0.txt -OutFile dist\KanzonasPDF\LICENSE-AGPL-3.0.txt }
          catch { Write-Warning "Couldn't download the AGPL text: $_" }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist\KanzonasPDF\LICENSE.txt }
          @"
          KanzonasPDF is free software: you can redistribute it and/or modify it under the terms of
          the GNU Affero General Public License version 3 (see LICENSE-AGPL-3.0.txt).
          It is built on PyMuPDF / MuPDF (Artifex, AGPL 3.0), Qt for Python (LGPL 3.0) and other
          open-source libraries. Complete source code: https://github.com/keithlyding/KanzonasPDF
          "@ | Set-Content dist\KanzonasPDF\NOTICE.txt

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kanzonas; print(kanzonas.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KanzonasPDF -DestinationPath KanzonasPDF-v${{ steps.ver.outputs.version }}-windows.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup isn't available" }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\KanzonasPDF.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Test updating (install an older version, then the new one over it, no uninstall)
        shell: pwsh
        run: |
          # same files labeled 0.0, standing in for "the version the user already has"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=0.0 installer\KanzonasPDF.iss
          if ($LASTEXITCODE -ne 0) { throw "Old installer build failed" }
          $dir = "$env:RUNNER_TEMP\kzupgrade"
          $sargs = "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART"
          $p = Start-Process "dist-installer\KanzonasPDF-v0.0-setup.exe" -ArgumentList ($sargs + "/DIR=$dir") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Old version failed to install" }
          New-Item -Force "HKCU:\Software\KanzonasPDF\upgradetest" | Set-ItemProperty -Name keep -Value "yes"
          # the new setup gets no /DIR: it must find the existing install by itself
          $p = Start-Process "dist-installer\KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe" -ArgumentList $sargs -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Update over the old version failed" }
          $un = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F4C2A61-5B7E-4D3A-9C1F-2E6B7A9D4C11}_is1"
          $ver = (Get-ItemProperty $un).DisplayVersion
          if ($ver -ne "${{ steps.ver.outputs.version }}") { throw "Installed version is '$ver' after the update" }
          if ((Get-ItemProperty $un).InstallLocation.TrimEnd('\') -ne $dir) { throw "Update installed to a different folder" }
          if ((Get-ItemProperty "HKCU:\Software\KanzonasPDF\upgradetest").keep -ne "yes") { throw "Update lost the user's settings" }
          $p = Start-Process "$dir\KanzonasPDF.exe" -ArgumentList "--selftest","upgraded-selftest.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content upgraded-selftest.log; throw "Updated app failed its self test" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 5
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasPDF\upgradetest" -ErrorAction SilentlyContinue
          Remove-Item "dist-installer\KanzonasPDF-v0.0-setup.exe"
          Write-Host "Updated 0.0 -> ${{ steps.ver.outputs.version }} in place; settings kept"

      - name: Test the installer (install, self test the installed app, uninstall)
        shell: pwsh
        run: |
          $setup = "dist-installer\KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe"
          $dir = "$env:RUNNER_TEMP\kzinstall"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/DIR=$dir","/TASKS=pdfdefault" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed with code $($p.ExitCode)" }
          $p = Start-Process "$dir\KanzonasPDF.exe" -ArgumentList "--selftest","installed-selftest.log" -PassThru -Wait
          Get-Content installed-selftest.log
          if ($p.ExitCode -ne 0) { throw "Installed app failed its self test" }
          if (-not (Test-Path "HKCU:\Software\Classes\KanzonasPDF.Document\shell\open\command")) { throw "PDF association missing" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\KanzonasPDF.exe") { throw "Uninstall left the app behind" }

      - name: Portable version (settings and files stay in a data folder beside the exe)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item -Recurse dist\KanzonasPDF portable\KanzonasPDF
          @"
          KanzonasPDF portable

          Because this file is here, KanzonasPDF keeps its settings, your signatures, stamp images
          and certificate in the "data" folder next to KanzonasPDF.exe instead of the computer's
          registry and user folders. Copy the whole KanzonasPDF folder anywhere (a USB
          stick, a network drive) and run KanzonasPDF.exe. No installation or Python needed.
          Delete this file to make it behave like the installed version.
          "@ | Set-Content portable\KanzonasPDF\portable.txt
          Compress-Archive -Path portable\KanzonasPDF -DestinationPath KanzonasPDF-v$v-portable.zip
          # test a copy: it must run, keep its settings in data\ and leave the registry alone
          Remove-Item -Recurse -Force "HKCU:\Software\KanzonasPDF" -ErrorAction SilentlyContinue
          Copy-Item -Recurse portable\KanzonasPDF "$env:RUNNER_TEMP\kzportable"
          $p = Start-Process "$env:RUNNER_TEMP\kzportable\KanzonasPDF.exe" -ArgumentList "--selftest","portable-selftest.log" -PassThru -Wait
          Get-Content portable-selftest.log
          if ($p.ExitCode -ne 0) { throw "Portable app failed its self test" }
          if (-not (Test-Path "$env:RUNNER_TEMP\kzportable\data\settings.ini")) { throw "Portable settings not in data folder" }
          if (Test-Path "HKCU:\Software\KanzonasPDF") { throw "Portable app wrote to the registry" }

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-portable
          path: KanzonasPDF-v${{ steps.ver.outputs.version }}-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-windows
          path: KanzonasPDF-v${{ steps.ver.outputs.version }}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KanzonasPDF-v${{ steps.ver.outputs.version }}-setup
          path: dist-installer/KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe

      # Publishing is automatic: when a push to initial-editor carries a version number that has
      # no release yet, the files this build just tested are published as that release (no
      # second build). Repository variable AUTO_RELEASE changes this:
      #   (unset)  publish automatically;  draft  make a draft to check and publish by hand;
      #   false    don't release (create a release/tag v<version> by hand; that builds and publishes).
      - name: Is this version already released?
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          $new = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "Version ${{ steps.ver.outputs.version }}: new release = $new"
          exit 0

      - name: Publish release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/initial-editor' && steps.rel.outputs.new == 'true' &&
           vars.AUTO_RELEASE != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: ${{ vars.AUTO_RELEASE == 'draft' && !startsWith(github.ref, 'refs/tags/v') }}
          name: KanzonasPDF ${{ steps.ver.outputs.version }}
          prerelease: ${{ startsWith(steps.ver.outputs.version, '0.') }}
          body: |
            **Download `KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe`** and run it (no administrator rights needed).
            **Portable (no install; settings stay with the app):** download `-portable.zip`, unzip it
            anywhere (e.g. a USB stick) and run `KanzonasPDF.exe`; settings stay in its `data` folder.

            What's new: see [CHANGELOG.md](https://github.com/keithlyding/KanzonasPDF/blob/v${{ steps.ver.outputs.version }}/CHANGELOG.md).
            Free software under the GNU AGPL 3.0.
          files: |
            dist-installer/KanzonasPDF-v${{ steps.ver.outputs.version }}-setup.exe
            KanzonasPDF-v${{ steps.ver.outputs.version }}-portable.zip
            KanzonasPDF-v${{ steps.ver.outputs.version }}-windows.zip
